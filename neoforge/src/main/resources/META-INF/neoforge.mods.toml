modLoader = "javafml"
loaderVersion = "${neo_loader_version_range}"
issueTrackerURL = "https://github.com/Suel-ki/TarotCards-Remastered/issues"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/tarotcards-remastered"
authors = "${mod_author}"
description = '''
${description}
'''
logoFile = "assets/tarotcards/icon.png"

[[mixins]]
config="${mod_id}-common.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type="required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "fzzy_config"
type="required"
versionRange = "*"
ordering = "NONE"
side = "BOTH"